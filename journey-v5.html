 and a snack. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/1f9a22731606133b468860d8a5f64e44f102ffb8.wav","Put the trip on hold. Tap the gold button.":"assets/voices-v5/4c7b69dcc736b324811b1d226ee4ce46fa539a42.wav","Check our home’s thick shield. Tap the gold button.":"assets/voices-v5/843cbc5a35ae61b8b65060196405bcc04ecbc184.wav","Share water and food inside. Tap the gold button.":"assets/voices-v5/56afdf8d85e07ddbe9509994f2e3df730deb5de2.wav","Our pals stay home with water and food. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/78727ae998ee7ea3ae29862b5b8956d4a466de5d.wav","Put the spare battery on board. Tap the gold button.":"assets/voices-v5/4d353e24e98db1424f012cb5d88dea38b8a3e834.wav","Push it over. Plug it in. Tap the gold button.":"assets/voices-v5/dbd95cec163cfb0ece10ec6cbbcce4ed00db3748.wav","Our pals bring power. They use water and food. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/46aa210b0c81a6e069d3a949c8a4aa15b69acf2b.wav","Open the stored food list. Tap the gold button.":"assets/voices-v5/39b153f4aff60315cd3a9eb46a914f9fc9bbe26a.wav","Turn on the food cooler. Tap the gold button.":"assets/voices-v5/cc513f217f100d42c0dea7ba07422656e82083f2.wav","Pack the food we stored. Tap the gold button.":"assets/voices-v5/602cdcb6b1e5e5e0c3fd544cf2366f8b80bcd872.wav","We use power to chill food and save our water. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/632d49840c60cac06a881f5b7864825e3fd724bc.wav","Lay the mat. Pack our supplies. Tap the gold button.":"assets/voices-v5/5117228741b2a0c851b6a8cc12a9b4295fc3e03b.wav","Open the panel together. Tap the gold button.":"assets/voices-v5/be2a9a7936596ca31910c9e20f64998b6084788a.wav","Connect the battery to store power. Tap the gold button.":"assets/voices-v5/4fd9c32d111c8ee87c9e0e8b5b5ee65ed320bc0b.wav","Our pals open the panel, then have water and food. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/2995d9df31a124783f0774d09a55ba6dbe869a4f.wav","Check tools. Clean the panel. Tap the gold button.":"assets/voices-v5/c1aa9518198ede1f9d0403b2da92ca5bc7df8336.wav","The clean panel charges batteries. Our helpers use drinking water. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/923c1d1a64fa6fb2a49d4ed3b55d0bfc0f6e4a2e.wav","Open the safe cutting pattern. Tap the gold button.":"assets/voices-v5/f0203635c43769cebde6fbeed198642cc8aa2405.wav","Line up the coat together. Tap the gold button.":"assets/voices-v5/004c50b2633370e19459f5ac1f87953b189c5472.wav","Mark plugs. Set out our supplies. Tap the gold button.":"assets/voices-v5/dd2146b5e12837b5edf86045df39c8873735312f.wav","Our pals save power. They have water and food. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/e7cde46ce577f4e9ff5fa5823e3aa5cb3b62e29a.wav","Fit the path light’s battery. Tap the gold button.":"assets/voices-v5/c13090d6feb9175b5712a19179e7e1090ff769df.wav","Carry supplies to the turn. Tap the gold button.":"assets/voices-v5/9edfb32668d889c62205faab362388a8f2ddb04a.wav","Press the nearby radio test button. Tap the gold button.":"assets/voices-v5/c14af0adc3c137865562abaed45ecc91dc831f2e.wav","Our pals check the path and test the radio. You helped! Play the next mission, or rest for now. The next trip uses one power, one water, and one food.":"assets/voices-v5/f628c579dd034a5e83f8059e9c47d09cf90e6590.wav","Check the wheels turn freely. Tap the gold button.":"assets/voices-v5/c60e9ca886df547d85ec8a648c6e53087d0a24bd.wav","Pack water and food. Tap the gold button.":"assets/voices-v5/ca9fdc62d4b8ec2839b95db359830189b5c6231c.wav","Take our pals to the markers. Tap the gold button.":"assets/voices-v5/ecb0812a300b8acefc7035c9f0c489f48f77b483.wav","Our pals have supplies and wait by the safe path. You helped! Let’s bring Jade home.":"assets/voices-v5/1b1af72e09787ab44bae03bf165465c88b05cc0e.wav"};

<script>/* Moon Base Pals — interface. All mission mutations pass through MoonModel.reduce. */
(() => {
  'use strict';
  const M = window.MoonModel;
  const root = document.getElementById('app');
  const KEY = 'mbp_v4', PREF = 'mbp_preferences_v4';
  const PALS = ['crawler','flyer','balloon','bread'];
  const ICONS = {power:'⚡',water:'💧',food:'🥬'};
  let storageError = '', notice = '', saved = null, state, home = true, modal = null;
  let paused = false, selectedTool = false, peek = '', toastTimer, inputAt = 0, lastAction='', lastId='', context, master;
  let narrationAudio = null, muted = false, audioOn = true, lastFocus = null, keepsake=false, voiceEpoch=0, pendingName=null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function read(key){try{return localStorage.getItem(key);}catch(e){storageError='blocked';return null;}}
  function write(key,value){try{localStorage.setItem(key,value);return true;}catch(e){storageError='blocked';return false;}}
  const prefsRaw = read(PREF);
  let prefs = {};
  try{prefs = JSON.parse(prefsRaw)||{};}catch(e){/* Safe defaults for damaged preferences. */}
  muted = prefs.muted === true; audioOn = prefs.audioOn !== false;
  const raw = read(KEY);
  saved = raw ? M.restore(raw) : null;
  state = saved || M.create('Sun Zeyi','en');
  if(raw && !saved) notice='damaged';
  else if(!raw && read('mbp_v3')) notice='legacy';
  function t(zh,en){return en;}
  function L(pair){return pair?.en || '';}
  function current(){return M.MISSIONS[state.day-1];}
  function plan(){return current().plans.find(p=>p.id===state.plan);}
  function part(){return M.PARTS.find(p=>p.id===current().part);}
  function persist(){
    saved=state;
    write(KEY,M.serialize(state));
    write(PREF,JSON.stringify({muted,audioOn,lang:state.lang}));
  }
  function textNotice(){
    if(storageError)return t('⚠ 浏览器不能保存到磁盘。临时进度仍可继续；请保持此页打开，关闭后可能丢失。','⚠ This browser cannot write saves. You can continue in this open page; closing it may lose progress.');
    if(notice==='damaged')return t('旧存档有损坏。没有删除原数据；开始新旅程前会请你确认。','This save is damaged. It has not been deleted. Confirm before starting a new journey.');
    if(notice==='legacy')return t('找到旧版旅程。新版有新的任务与规则，旧存档仍保留；这次从新的救援开始。','An earlier journey is kept safely. This edition has new missions; start a new rescue.');
    return '';
  }
  function prefsSave(){write(PREF,JSON.stringify({muted,audioOn,lang:state.lang}));}
  function cancelVoice(){
    voiceEpoch++;
    if(narrationAudio){narrationAudio.pause();narrationAudio.removeAttribute('src');narrationAudio.load();narrationAudio=null;}
    try{window.speechSynthesis?.cancel();}catch(e){/* no system narration */}
  }
  function ensureAudio(){
    if(muted)return;
    try{if(!context){context=new(window.AudioContext||window.webkitAudioContext)();master=context.createGain();master.connect(context.destination);}if(!paused)master.gain.setValueAtTime(.17,context.currentTime);if(context.state==='suspended')context.resume().catch(()=>{});}catch(e){/* Silent play stays available. */}
  }
  function tone(success=true){
    if(muted || paused)return;
    ensureAudio();if(!context||!master)return;
    try{const o=context.createOscillator(),g=context.createGain();o.type='sine';o.frequency.value=success?660:440;g.gain.setValueAtTime(.001,context.currentTime);g.gain.exponentialRampToValueAtTime(.22,context.currentTime+.015);g.gain.exponentialRampToValueAtTime(.001,context.currentTime+.17);o.connect(g);g.connect(master);o.start();o.stop(context.currentTime+.18);o.onended=()=>{o.disconnect();g.disconnect();};}catch(e){/* Visual feedback is sufficient. */}
  }
  function speak(text,manual=false){
    cancelVoice();if(muted||(!audioOn&&!manual)||paused||!text)return;
    const epoch=voiceEpoch;
    const file=window.MOON_VOICES?.[text];
    if(file){narrationAudio=new Audio(file);narrationAudio.volume=.85;narrationAudio.play().catch(()=>{if(epoch===voiceEpoch)systemSpeak(text,manual);});return;}
    systemSpeak(text,manual);
  }
  function systemSpeak(text,manual=false){
    if(muted||(!audioOn&&!manual)||paused)return;
    try{const voices=window.speechSynthesis?.getVoices()||[],v=voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(!v)return;const u=new SpeechSynthesisUtterance(text);u.lang=v.lang;u.voice=v;u.rate=.84;window.speechSynthesis.speak(u);}catch(e){/* No language voice: visible instructions and demonstrations remain. */}
  }
  function narrate(manual=false){speak(window.MoonNarration?.get(state) || L(current().goal),manual);}
  function stopSound(){cancelVoice();if(master&&context)master.gain.setValueAtTime(0,context.currentTime);}
  function toast(text){$('announcer').textContent=text;const el=$('toast');if(el)el.textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const e=$('toast');if(e)e.textContent='';},3500);}
  function submit(event){
    if(home||paused||modal)return;
    const old=state,next=M.reduce(state,event);
    if(next===old)return;
    state=next;selectedTool=false;peek='';persist();
    if(event.type==='ANSWER'&&state.stage==='quiz')tone(false);else tone(true);
    render();
    const focusTarget=root.querySelector(state.stage==='action'?'.bench-target.next':'.chapter-line h1');
    if(focusTarget){focusTarget.setAttribute('tabindex','-1');focusTarget.focus({preventScroll:true});}
    if(old.stage!==state.stage) {
      if(state.stage==='action')window.scrollTo({top:0,behavior:'instant'});
      else window.scrollTo({top:0,behavior:'instant'});
    }
    
    narrate();
  }
  function img(pal,expr='happy',cls='avatar'){return `<img class="${cls}" src="assets/${esc(pal)}_${esc(expr)}.jpg" alt="${esc(pal[0].toUpperCase()+pal.slice(1))}" data-fallback="${esc(pal)}">`;}
  function button(text,action,cls='btn',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${text}</button>`;}
  function tool(text,action,label){return button(text,action,'tool',`aria-label="${esc(label)}" title="${esc(label)}"`);}
  const K=window.MoonKidCopy;
  function copy(){return K.missions[state.day];}
  function pc(p=plan()){return copy().plans[p.id];}
  function partName(id){return K.parts[id]||id;}
  function header(){return `<header class="header"><button class="brand" data-action="home" aria-label="Go home"><span class="brand-moon" aria-hidden="true">☾</span><b>Moon Base Pals</b></button><nav aria-label="Game controls">${!home?button('Ⅱ <span>Pause</span>','pause','quiet'):''}${button('☰ <span>Menu</span>','menu','quiet')}</nav></header>`;}
  function dots(n,total=3){return `<span class="step-dots" aria-label="${n} of ${total} steps done">${Array.from({length:total},(_,i)=>`<i class="${i<n?'done':i===n?'now':''}">${i<n?'✓':''}</i>`).join('')}</span>`;}
  function resourceName(k){return {power:'Power',water:'Water',food:'Food'}[k];}
  function meters(){return `<div class="meters" aria-label="Our supplies">${Object.keys(ICONS).map(k=>`<div class="resource ${k}" role="meter" aria-label="${resourceName(k)}" aria-valuenow="${state.resources[k]}" aria-valuemin="0" aria-valuemax="10"><span>${ICONS[k]} ${resourceName(k)}</span><b>${state.resources[k]}<small>/10</small></b><div class="segments" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<state.resources[k]?'on':''}"></i>`).join('')}</div></div>`).join('')}</div>`;}
  function missionDelta(){
    const firstChange=state.history.find(e=>e.type==='SET_LANG');
    let replay=M.create(state.name,firstChange?(firstChange.lang==='en'?'zh':'en'):state.lang);
    for(const e of state.history){const next=M.reduce(replay,e);if(e.type==='STEP'&&replay.day===state.day&&replay.stage==='action'&&next.stage==='quiz')return Object.fromEntries(Object.keys(ICONS).map(k=>[k,next.resources[k]-replay.resources[k]]));replay=next;}
    return plan()?.eff||{};
  }
  function delta(eff,actual=false){
    const values=actual?missionDelta():eff;
    return `<div class="trade">${Object.entries(values).filter(([,v])=>v!==0).map(([k,v])=>{const shown=actual?v:Math.min(v,10-state.resources[k]);return `<span class="delta ${v<0?'cost':'gain'}">${v<0?'Use':'Get'} <b>${Math.abs(shown)}</b> <span aria-label="${resourceName(k)}">${ICONS[k]}</span>${!actual&&shown<v?'<small> full</small>':''}</span>`;}).join('')}</div>`;
  }
  function canAfford(p){return Object.entries(p.eff).every(([k,v])=>state.resources[k]+Math.min(0,v)>=0);}
  function raster(file,cls='',alt=''){return `<img class="${cls}" src="assets/${file}" alt="${esc(alt)}" draggable="false">`;}
  function partArt(id,cls=''){const i=M.PARTS.findIndex(p=>p.id===id);return `<span class="part-art ${cls}" role="img" aria-label="${partName(id)}" style="--px:${(i%3)*50}%;--py:${i<3?0:100}%"></span>`;}
  const SCENES={solar:'scene_moon_day.jpg',water:'scene_control_room.jpg',garden:'scene_greenhouse.jpg',shelter:'scene_control_room.jpg',jade:'scene_moon_day.jpg'};
  const LOCATIONS={solar:'Sun station',water:'Water room',garden:'Our garden',shelter:'Safe shelter',jade:'Jade’s workshop'};
  const MOUNTS={battery:[73,58],wheels:[48,80],antenna:[69,22],controller:[30,46],panel:[74,43],insulation:[50,65]};
  function rover(all=false,cls=''){
    const fixed=all||state.installed.length===6;
    return `<div class="jade ${cls}">${raster('story-v5/'+(fixed?'jade.png':'jade-sleep.png'),'jade-image',fixed?'Jade is ready to roll':'Jade is waiting for repairs')}${!all?M.PARTS.map(p=>{const xy=MOUNTS[p.id];return `<span class="repair-status ${state.installed.includes(p.id)?'done':'waiting'}" style="left:${xy[0]}%;top:${xy[1]}%" aria-label="${partName(p.id)} ${state.installed.includes(p.id)?'fixed':'needs fixing'}">${state.installed.includes(p.id)?'✓':'·'}</span>`;}).join(''):''}</div>`;
  }
  function palLine(text,expression='talk'){return `<div class="pal-line">${img(current().pal,expression,'pal-face')}<p>${esc(text)}</p>${button('◖))','read','listen',`aria-label="Listen again" title="Listen again"`)}</div>`;}
  function simpleArt(loc=current().location){if(loc==='jade')return rover();if(loc==='solar')return raster('prop_solar_panel.jpg','hero-prop','Solar panel');if(loc==='water')return raster('prop_water_tank.jpg','hero-prop','Water tank');if(loc==='garden')return raster('prop_potato.jpg','hero-prop','Food from our garden');return raster('prop_helmet.jpg','hero-prop','Our shelter practice');}
  function homeView(){return `<main id="main" class="home page" tabindex="-1"><section class="cover"><div class="cover-copy"><p class="overline">A little Moon adventure</p><h1>Let’s help<br><em>Jade!</em></h1><p>Our little rover needs a friend.</p>${button(saved?'Keep playing <span aria-hidden="true">→</span>':'Let’s play <span aria-hidden="true">→</span>',saved?'continue':'new','btn play-button')}<span class="cover-note">${saved?'Mission '+saved.day+' · Your place is saved':'Tap. Listen. Play.'}</span></div><div class="cover-art">${rover(false,'cover-jade')}<div class="cover-pal">${img('crawler','happy','')}<span>We can help!</span></div><span class="moon-sticker" aria-hidden="true">✦</span></div></section><footer class="home-foot"><span>Made by Sun Zeyi · Team Little Hero</span>${button('For grown-ups','guide','text-btn')}</footer></main>`;}
  function stageName(stage){return {brief:'Our mission',plan:'Choose',action:'Let’s do it',quiz:'What helps?',repair:'Fix Jade',summary:'You helped!',drive:'The way home',certificate:'Jade is home!'}[stage]||'';}
  function choiceArt(p){
    if(['🔋'].includes(p.icon)||p.title.en.includes('batter'))return partArt('battery');
    if(['🤝'].includes(p.icon)||p.title.en.includes('together')||p.title.en.includes('hand')||p.title.en.includes('walking'))return `<span class="pair-pals">${img(current().pal,'happy','')}${img(current().pal==='crawler'?'flyer':'crawler','happy','')}</span>`;
    if(['⚙️','🎛️','💡'].includes(p.icon))return partArt('controller');
    if(['🧹','☀️'].includes(p.icon))return raster('prop_solar_panel.jpg','choice-picture','Solar panel');
    if(p.icon==='🧊')return raster('prop_cookies.jpg','choice-picture','Stored food');
    if(['💧','♻️','🔧'].includes(p.icon))return raster(current().location==='garden'?'prop_potato.jpg':'prop_water_tank.jpg','choice-picture',current().location==='garden'?'Garden':'Water');
    if(p.icon==='📡'||p.icon==='🚩')return raster('prop_walkie_talkie.jpg','choice-picture','Radio');
    return raster('scene_control_room.jpg','choice-picture','Safe room');
  }
  function pictureChoices(){return `<div class="picture-choices">${current().plans.map(opt=>`<button class="choice-card" data-action="choose" data-id="${opt.id}" ${!canAfford(opt)?'disabled':''}>${choiceArt(opt)}<strong>${esc(pc(opt).title)}</strong>${delta(opt.eff)}${!canAfford(opt)?'<small>Try the other choice</small>':''}</button>`).join('')}</div>`;}
  function answerArt(a){
    if(state.day===1)return `<span class="panel-picture ${a.id==='b'?'covered':''}">${raster('prop_solar_panel.jpg','','')}</span>`;
    if(state.day===10)return a.id==='b'?partArt('panel'):'<span class="answer-symbol" aria-hidden="true">⛵</span>';
    const files={2:'prop_water_tank.jpg',3:'prop_water_tank.jpg',4:'story-v5/jade.png',5:'scene_control_room.jpg',6:'story-v5/parts.png',7:'prop_water_tank.jpg',8:'story-v5/jade.png',9:'prop_cookies.jpg',11:'story-v5/parts.png',12:'story-v5/parts.png',13:'prop_solar_panel.jpg',14:'scene_moon_day.jpg'};
    if(a.correct&&[6,11].includes(state.day))return partArt('battery');
    if(a.correct&&state.day===12)return partArt('insulation');
    if(a.correct)return raster(files[state.day],'answer-picture','');
    return `<span class="answer-symbol" aria-hidden="true">${a.icon}</span>`;
  }
  function stepAsset(p,n){
    const icon=p.steps[n].icon,loc=current().location;
    if(icon==='🔋')return partArt('battery','action-part');
    if(icon==='🛞')return partArt('wheels','action-part');
    if(icon==='📡')return raster('prop_walkie_talkie.jpg','action-prop','Radio');
    if(icon==='🍱')return raster('prop_cookies.jpg','action-prop','Food for our pals');
    if(icon==='🧥')return partArt('insulation','action-part');
    if(['⚙️','💡','🎛️','⬆️','🔌'].includes(icon))return partArt('controller','action-part');
    if(icon==='💧'&&loc!=='garden')return raster('prop_water_tank.jpg','action-prop','Water');
    if(loc==='solar')return raster('prop_solar_panel.jpg','action-prop','Solar panel');
    if(loc==='water')return raster('prop_water_tank.jpg','action-prop','Water tank');
    if(loc==='garden')return raster('prop_potato.jpg','action-prop','Our plants');
    if(loc==='jade')return rover(false,'action-jade');
    return raster('scene_control_room.jpg','action-prop','Shelter');
  }
  function workbench(){
    const p=plan(),n=state.steps.length,label=pc().steps[n],icon=p.steps[n].icon;
    const dirty=/Brush|Clean the panel/.test(label);
    return `<section class="workbench" aria-label="Hands-on workbench"><div class="action-picture">${stepAsset(p,n)}${dirty?'<div class="dust-spots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>':''}${n>0?`<div class="done-token" role="status">✓ ${esc(pc().steps[n-1])}</div>`:''}<button class="bench-target next ${state.quiz.help?'guided-target':''}" data-action="step" data-id="${p.steps[n].id}" aria-label="${esc(label)}"><span aria-hidden="true">${icon}</span><b>${esc(label)}</b><span class="tap-hand" aria-hidden="true">☝</span></button></div><div class="step-footer">${dots(n)}<span>Step ${n+1} of 3</span>${button('Help me','hint','text-btn')}</div></section>`;
  }
  function repairBench(){const p=part(),xy=MOUNTS[p.id];return `<section class="repair-bench"><div class="repair-rover">${rover()}<button class="mount-point" data-action="install" style="left:${xy[0]}%;top:${xy[1]}%" aria-label="Fit the ${partName(p.id)}"><span aria-hidden="true">＋</span></button></div><div class="part-to-fit">${partArt(p.id)}<strong>${partName(p.id)}</strong><span>Tap ＋ to fit it</span></div></section>`;}
  function driveScene(){const names=['Go around the crater','Follow the path light','Go home!'];return `<section class="drive-scene"><div class="drive-world">${raster('scene_moon_day.jpg','drive-background','A safe route on the Moon')}<div class="route-track" aria-hidden="true"></div><div class="route-rover" style="left:${6+state.drive*25}%">${rover(true)}</div><button class="route-stop btn" data-action="drive" data-id="${['crater','beacon','home'][state.drive]}">${['↪','⚑','⌂'][state.drive]} ${names[state.drive]}</button></div><div class="step-footer">${dots(state.drive)}<span>${state.drive+1} of 3</span></div></section>`;}
  function playView(){
    const m=current(),c=copy(),p=plan();let body='',line='',action='';
    if(state.stage==='brief'){line=c.brief;body=`<div class="story-scene scene-${m.location}">${m.location==='garden'||m.location==='shelter'?raster(SCENES[m.location],'room-picture',LOCATIONS[m.location]):simpleArt()}${m.location==='solar'?'<span class="sunlight" aria-hidden="true">☀</span>':''}</div>`;action=button('Let’s help <span aria-hidden="true">→</span>','start','btn');}
    if(state.stage==='plan'){line='Which way shall we help?';body=`<section class="plan-surface">${meters()}${pictureChoices()}${m.plans.every(p=>!canAfford(p))?button('Ask a pal for supplies','supply','btn'):''}</section>`;}
    if(state.stage==='action'){line=pc().steps[state.steps.length];body=workbench();}
    if(state.stage==='quiz'){line=state.quiz.wrong?'Let’s look together. '+c.fact:c.fact;body=`<section class="question-surface"><h2 tabindex="-1">${esc(c.question)}</h2><div class="answer-grid">${m.answers.map(a=>`<button class="answer ${state.quiz.help&&a.correct?'hinted':''}" data-action="answer" data-id="${a.id}">${answerArt(a)}<b>${esc(c.options[a.id])}</b>${state.quiz.help&&a.correct?'<span class="hint-mark">← Try this</span>':''}</button>`).join('')}</div>${button('Ask a pal','hint','text-btn')}</section>`;}
    if(state.stage==='repair'){line='A new '+partName(m.part).toLowerCase()+' for Jade!';body=repairBench();}
    if(state.stage==='summary'){line=pc().result;body=`<section class="summary-surface"><div class="reward-art">${m.part?partArt(m.part):choiceArt(p)}<span class="reward-check" aria-hidden="true">✓</span></div><h2 tabindex="-1">You helped!</h2>${delta(p.eff,true)}${m.part?`<p>${partName(m.part)} fitted · ${state.installed.length} of 6</p>`:''}</section>`;action=`<div class="summary-actions">${button(state.day===14?'Let’s go home →':'Next mission →','next','btn')}${button('Rest for now','rest','text-btn')}</div>${state.day<14?'<p class="upkeep">Next trip uses 1 ⚡ + 1 💧 + 1 🥬</p>':''}`;}
    if(state.stage==='drive'){line=['Let’s go around the big crater.','Follow the light. Our pals are near!','Our pals are waiting. Let’s go home!'][state.drive];body=driveScene();}
    return `<main id="main" class="page play stage-${state.stage}" tabindex="-1"><div class="chapter-line"><span>Mission ${state.day} <small>/ 14</small></span><h1>${esc(c.title)}</h1>${button('Our supplies','supplies','text-btn')}</div><article class="storybook">${body}<div class="story-bottom">${palLine(line,state.stage==='summary'?'wink':'talk')}${action?'<div class="primary-row">'+action+'</div>':''}</div></article>${storageError?'<p class="save-warning" role="status">This browser cannot save. Keep this page open to keep playing.</p>':''}</main>`;
  }
  function reunionView(){return `<main id="main" class="page reunion" tabindex="-1"><h1>Jade is home!</h1><p>You helped us, ${esc(state.name)}.</p><div class="reunion-art">${rover(true)}<div class="reunion-pals">${PALS.map(p=>img(p,'wink','')).join('')}</div></div>${button('My keepsake ✦','keepsake','btn')}${button('Rest for now','rest','text-btn')}</main>`;}
  function certificateView(){if(!keepsake)return reunionView();return `<main id="main" class="certificate-wrap page" tabindex="-1"><article class="certificate"><p>Moon Base Pals</p><h1>You helped Jade!</h1><h2>${esc(state.name)}</h2>${rover(true,'certificate-jade')}<p>You cared for our Moon base.<br>You brought our friend home.</p><div class="cert-stats"><b>14 missions</b><b>6 parts fixed</b><b>1 happy crew</b></div><div class="cert-crew">${PALS.map(p=>img(p,'happy','')).join('')}</div><p class="cert-sign">Sun Zeyi · Team Little Hero · 2026</p><small>A game keepsake. Not NASA certification.</small></article><div class="cert-actions">${button('Print','print','btn')}${button('Home','rest','quiet')}</div></main>`;}
  function modalView(){
    if(!modal)return '';let title='',content='';
    if(modal==='pause'){title='Take a little break';content=`${img(current().pal,'sleep','modal-pal')}<p>We’ll wait right here.</p>${button('Keep playing →','close','btn')}${button('Save & go home','rest','text-btn')}`;}
    if(modal==='new'){title='Start again?';content=`<p>This replaces your saved journey.</p><label for="commander">Your name <small>(optional)</small></label><input id="commander" maxlength="40" value="${esc(pendingName||state.name)}" autocomplete="off">${button('Start a new journey','confirm-new','btn')}${button('Keep my journey','close','text-btn')}`;}
    if(modal==='menu'){title='Our little menu';content=`<div class="menu-options">${button(muted?'Sound: off':'Sound: on','mute','quiet')}${button(audioOn?'Read aloud: on':'Read aloud: off','voice-toggle','quiet')}${!home?button('Our supplies','supplies','quiet'):''}${button('How to play','help','quiet')}${button('For grown-ups','guide','quiet')}${saved?button('Start a new journey','new','quiet'):''}${button('Back to play','close','btn')}</div>`;}
    if(modal==='help'){title='Let’s try together';content=`${img(home?'crawler':current().pal,'happy','modal-pal')}<p>Look for the gold button.<br>Tap it to help!</p><p>Tap ◖)) to hear it again.</p>${!home&&state.stage==='action'?button('Show me this step','demo','btn'):button('Let’s play','close','btn')}`;}
    if(modal==='supplies'){title='Our supplies';content=meters()+`<p>Each box holds up to 10.</p><h3>Jade’s repairs</h3><div class="repair-list">${M.PARTS.map(p=>`<span>${partArt(p.id)}<b>${partName(p.id)}</b><small>${state.installed.includes(p.id)?'✓ Fitted':'Waiting'}</small></span>`).join('')}</div>`+button('Back to play','close','btn');}
    if(modal==='guide'){title='For grown-ups';const sources=[...new Map(M.MISSIONS.map(m=>[m.source.url,m.source])).values()];content=`<p>English picture-and-voice play for ages 6–7. Let your child try one short mission, then take a break. Ask “What changed?”</p><p>There are no timers or penalties for a wrong guess. The gold target and Listen button support beginning readers. The voice is synthesized, not a child recording.</p><details><summary>Science and the game model</summary><p>This is a fictional Moon base. Supplies, fast harvests and repair steps are simplified game rules, not spaceflight procedures. Plants need both water and light. Mission numbers are not lunar day-night cycles. Shelter practice is not live space weather.</p><p>${esc(L(current().fact))}</p><ul>${sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a></li>`).join('')}</ul></details><details><summary>About this game</summary><p>Created by Sun Zeyi · Team Little Hero. Not an official NASA product. The actual competition challenge selection remains unverified.</p><p>All game art and voices are stored locally. Progress stays in this browser. No trackers. This version has not yet been tested with real children; reading ease, enjoyment and learning are not certified.</p><p>Jade’s six dots show which replacement parts have been fitted. The artwork shows the old parts before replacement. At six repairs, Jade wakes up.</p></details>${button('Back','close','btn')}`;}
    return `<div class="overlay-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div class="modal-top"><h2 id="modal-heading">${title}</h2>${button('×','close','close',`aria-label="Close and continue"`)}</div>${content}</section></div>`;
  }

  function setModal(which){
    lastFocus=document.activeElement?.dataset?.action||null;modal=which;paused=true;selectedTool=false;stopSound();render();
    root.querySelector('.modal button')?.focus();
  }
  function closeModal(){modal=null;paused=false;render();if(lastFocus)root.querySelector(`[data-action="${lastFocus}"]`)?.focus();}
  function render(){
    document.documentElement.lang='en';
    root.innerHTML=`<div class="world-bg"></div><div class="star-grain"></div>${header()}${textNotice()?`<div class="page"><div class="notification" role="status">${esc(textNotice())}</div></div>`:''}${home?homeView():state.stage==='certificate'?certificateView():playView()}${modalView()}<div id="toast" class="toast" role="status"></div>`;
    if(modal){root.querySelector('main')?.setAttribute('inert','');root.querySelector('header')?.setAttribute('inert','');}
  }
  function startNew(){
    const input=$('commander');const name=(input?.value??pendingName??state.name).trim().slice(0,40)||'Sun Zeyi';
    state=M.create(name,'en');home=false;modal=null;paused=false;notice='';selectedTool=false;pendingName=null;keepsake=false;persist();render();window.scrollTo({top:0,behavior:'instant'});narrate();
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b||!root.contains(b)||b.disabled)return;
    const action=b.dataset.action,id=b.dataset.id;
    if(paused&&!b.closest('.modal'))return;
    if(['start','choose','step','answer','install','next','drive','guided','supply'].includes(action)){
      const now=performance.now();if(now-inputAt<230&&action===lastAction&&id===lastId)return;inputAt=now;lastAction=action;lastId=id;
    }
    if(action==='new'){pendingName=$('commander')?.value||state.name;if(saved||notice==='damaged')setModal('new');else startNew();}
    else if(action==='confirm-new')startNew();
    else if(action==='continue'){state=saved;home=false;paused=false;modal=null;render();narrate();}
    else if(action==='mute'){muted=!muted;if(muted)stopSound();else{ensureAudio();if(master)master.gain.setValueAtTime(.17,context.currentTime);}prefsSave();render();if(!muted&&!home)narrate();}
    else if(action==='voice-toggle'){audioOn=!audioOn;cancelVoice();prefsSave();render();}
    else if(action==='help'||action==='guide'||action==='pause'||action==='menu'||action==='supplies')setModal(action);
    else if(action==='close')closeModal();
    else if(action==='rest'||action==='home'){cancelVoice();if(!home)persist();home=true;modal=null;paused=false;peek='';render();}
    else if(action==='start')submit({type:'START_DAY'});
    else if(action==='choose')submit({type:'CHOOSE_PLAN',id});
    else if(action==='step')submit({type:'STEP',id});
    else if(action==='answer')submit({type:'ANSWER',id});
    else if(action==='hint'){submit({type:'HINT'});if(state.stage==='action'){root.querySelector('.bench-target.next')?.focus();toast('Tap the gold button.');}}
    else if(action==='guided'){submit({type:'HINT'});const next=plan()?.steps.find(s=>!state.steps.includes(s.id));if(next){submit({type:'STEP',id:next.id});toast(t('我们一起完成了这一步。下一步，你来试试。','We did that step together. Try the next one.'));}}
    else if(action==='supply')submit({type:'SUPPLY'});
    else if(action==='install')submit({type:'INSTALL',id:current().part});
    else if(action==='next')submit({type:'NEXT_DAY'});
    else if(action==='drive')submit({type:'DRIVE',id});
    else if(action==='demo'){closeModal();submit({type:'HINT'});root.querySelector('.bench-target.next')?.focus();narrate(true);}
    else if(action==='tool'){selectedTool=!selectedTool;render();if(selectedTool)toast(t('工具拿好了。点击或拖到金色边框的物体。','Tool ready. Tap or drag to the gold-outlined object.'));}
    else if(action==='read')narrate(true);
    else if(action==='keepsake'){keepsake=true;render();window.scrollTo({top:0,behavior:'instant'});}
    else if(action==='print'){cancelVoice();window.print();}
  });
  root.addEventListener('dragstart',e=>{if(paused||home||!e.target.closest('.held-tool')){e.preventDefault();return;}selectedTool=true;e.dataTransfer.setData('text/plain','moon-tool');e.dataTransfer.effectAllowed='copy';});
  root.addEventListener('dragover',e=>{if(!paused&&e.target.closest('.bench-target.next')){e.preventDefault();e.dataTransfer.dropEffect='copy';}});
  root.addEventListener('drop',e=>{const target=e.target.closest('.bench-target.next');if(!target||paused||e.dataTransfer.getData('text/plain')!=='moon-tool')return;e.preventDefault();submit({type:'STEP',id:target.dataset.id});});
  root.addEventListener('error',e=>{const image=e.target;if(image.tagName!=='IMG'||image.dataset.failed)return;image.dataset.failed='true';image.classList.add('asset-fallback');image.alt=image.dataset.fallback||image.alt||'Pal';image.removeAttribute('src');},true);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(modal)closeModal();else if(!home)setModal('pause');return;}
    if(e.key==='Tab'&&modal){const focusable=[...root.querySelectorAll('.modal button,.modal a,.modal input,.modal summary')].filter(e=>!e.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSound();if(!home&&!modal)setModal('pause');}});
  window.addEventListener('pagehide',()=>{cancelVoice();if(!home)persist();});
  render();
})();
</script>
</body>
</html>
